name: Android APK

on:
  push:
    branches: [dev, main, 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: gradle
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
          chmod +x gradlew
      - name: Test, lint and assemble APKs
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: PhotoSphere-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release build
        uses: actions/upload-artifact@v7
        with:
          name: PhotoSphere-release-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
      - name: Verify tag belongs to dev
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/dev
      - name: Install Android SDK tools
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
          chmod +x gradlew
      - name: Build and verify signed release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing signing secret: $variable. See README release setup."
              exit 1
            fi
          done
          umask 077
          export RELEASE_STORE_FILE="$RUNNER_TEMP/photosphere-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          export APP_VERSION_NAME="${GITHUB_REF_NAME#v}"
          export APP_VERSION_CODE="$GITHUB_RUN_NUMBER"
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/PhotoSphere-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose dist/PhotoSphere-release.apk
          (cd dist && sha256sum PhotoSphere-release.apk > SHA256SUMS.txt)
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/photosphere-release.jks"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PhotoSphere-signed-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/PhotoSphere-release.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/PhotoSphere-release.apk dist/SHA256SUMS.txt \
              --verify-tag --title "PhotoSphere $RELEASE_TAG" --generate-notes
          fi
